[project]
name = "pfs"
version = "4.1.0"
description = "Poker Fusion Solver — 14 fusions, solveur NLHE, analyse post-partie iPoker/PMU, 718 tests"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "hmmlearn>=0.3.3",
    "pykalman>=0.11.2",
    "phevaluator>=0.6.0",
    "pokerkit>=0.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]
lab = [
    "cupy-cuda12x>=14.1.1",   # GPU côté Python — PAS JAX (aucune wheel Windows CUDA)
    "sympy>=1.13",
    "ripser>=0.6",
    "particles>=0.4",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY", "PERF", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
[[tool.mypy.overrides]]
module = ["scipy.*", "hmmlearn.*", "pykalman.*", "cupy.*", "ripser.*"]
ignore_missing_imports = true
