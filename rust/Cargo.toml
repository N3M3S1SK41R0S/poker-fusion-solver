[workspace]
resolver = "3"
members = [
    "crates/pfs-capture",   # M1 — WGC par fenêtre (Phase 1.1)
    "crates/pfs-vision",    # M3 — pHash cartes + glyph-templates (Phase 1.3)
    "crates/pfs-core",      # M5-M14 — noyau mathématique porté (Phase 2)
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"          # /!\ NE JAMAIS lier de code AGPL (postflop-solver, TexasSolver)

[workspace.dependencies]
# --- Capture (Phase 1) -------------------------------------------------
windows-capture = "2.0"          # WGC + DDA, seule API capturant une fenetre occultee
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", "Graphics_Capture",
] }
# --- Poker (Phase 2) ---------------------------------------------------
rs-poker = "5.0"                 # Apache-2.0, 50M+ mains/s/coeur, ranges + equite + ICM
# --- GPU (Phase 2) -----------------------------------------------------
cudarc = { version = "0.19", optional = true }   # NVIDIA, chargement dynamique
wgpu   = { version = "30.0", optional = true }   # repli vendor-agnostic
# --- Stockage ----------------------------------------------------------
heed = "0.20"                    # LMDB, lookup blueprint en mmap
zstd = "0.13"
# --- Divers ------------------------------------------------------------
rayon      = "1.10"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tracing    = "0.1"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
